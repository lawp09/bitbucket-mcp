{{- if .Values.gke.backendConfig.enabled -}}
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: {{ include "bitbucket-mcp.backendConfigName" . }}
  labels:
    {{- include "bitbucket-mcp.labels" . | nindent 4 }}
spec:
  timeoutSec: {{ .Values.gke.backendConfig.timeoutSec }}
  healthCheck:
    type: HTTP
    requestPath: /healthz
    port: {{ .Values.containerPort }}
{{- end }}
