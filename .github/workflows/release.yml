name: Release

on:
  push:
    tags:
      - "v*"

# Restrict default permissions (principle of least privilege)
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for hatch-vcs to read git history

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Set up Helm (chart tests)
        uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Run tests
        run: python -m pytest tests/ -v --cov=src --cov-report=term-missing

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Before anything is published: an image, a chart and a PyPI release are all keyed on
      # this version, and the image tagging only understands X.Y.Z.
      - name: Verify tag is X.Y.Z
        run: |
          if ! [[ "${GITHUB_REF_NAME#v}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vX.Y.Z"
            exit 1
          fi

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          WHEEL=$(ls dist/*.whl | head -1)
          PKG_VERSION=$(python -c "
          import pathlib
          wheel = pathlib.Path('$WHEEL').name
          print(wheel.removesuffix('.whl').split('-')[1])
          ")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION != package version $PKG_VERSION"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Verify server.json version matches tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SRV_VERSION=$(python -c "import json; print(json.load(open('server.json'))['version'])")
          if [ "$TAG_VERSION" != "$SRV_VERSION" ]; then
            echo "::error::server.json version ($SRV_VERSION) != tag v$TAG_VERSION"
            echo "::error::Update server.json before tagging a release"
            exit 1
          fi
          echo "server.json version check passed: $SRV_VERSION"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # Required for PyPI Trusted Publisher (OIDC)
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  publish-mcp-registry:
    needs: publish-pypi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          curl -sSL https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz | tar -xz -C /usr/local/bin mcp-publisher

      - name: Publish to MCP Registry
        env:
          MCP_GITHUB_TOKEN: ${{ secrets.MCP_GITHUB_TOKEN }}
        run: |
          mcp-publisher login github
          mcp-publisher publish server.json || echo "::warning::MCP Registry publish skipped (version may already exist)"

  # After the version checks in `build`, and behind the same `release` environment as PyPI.
  publish-image:
    needs: build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/bitbucket-mcp
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push (amd64 + arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  # After the image: a published chart must never point at an image that is not there.
  publish-chart:
    needs: publish-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: azure/setup-helm@v5
        with:
          version: v4.3.0

      - name: Package and push to GHCR (OCI)
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/bitbucket-mcp --version "$VERSION" --app-version "$VERSION" -d dist-chart
          echo "$GHCR_TOKEN" | helm registry login ghcr.io -u "$GH_ACTOR" --password-stdin
          # GHCR names are lower-case; docker/metadata-action lowercases the image, helm does not.
          helm push "dist-chart/bitbucket-mcp-$VERSION.tgz" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"

  github-release:
    needs: [publish-pypi, publish-mcp-registry, publish-chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::warning::No changelog entry found for v$VERSION"
            echo "Release $VERSION" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: dist/*
