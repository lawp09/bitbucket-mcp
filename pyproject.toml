[project]
name = "bitbucket-mcp-py"
version = "1.5.0"
description = "MCP Server for Bitbucket API - Container optimized with configurable tools, structured output and slim responses"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Philippe Lawson" },
]
keywords = ["mcp", "bitbucket", "api", "model-context-protocol", "mcp-server", "claude-code", "cursor", "github-copilot", "pull-request", "code-review", "bitbucket-cloud", "pipelines", "llm", "ai-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=1.1.1",
    "httpx>=0.27.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/lawp09/bitbucket-mcp-py"
Repository = "https://github.com/lawp09/bitbucket-mcp-py"
Issues = "https://github.com/lawp09/bitbucket-mcp-py/issues"
Changelog = "https://github.com/lawp09/bitbucket-mcp-py/blob/main/CHANGELOG.md"

[project.scripts]
bitbucket-mcp = "src.main:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.22.0",
]
keyring = [
    "keyring>=25.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
