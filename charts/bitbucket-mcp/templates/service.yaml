{{- $annotations := deepCopy .Values.service.annotations -}}
{{- if .Values.gke.backendConfig.enabled -}}
{{- $_ := set $annotations "cloud.google.com/backend-config" (printf "{\"default\": \"%s\"}" (include "bitbucket-mcp.backendConfigName" .)) -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bitbucket-mcp.fullname" . }}
  labels:
    {{- include "bitbucket-mcp.labels" . | nindent 4 }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "bitbucket-mcp.selectorLabels" . | nindent 4 }}
